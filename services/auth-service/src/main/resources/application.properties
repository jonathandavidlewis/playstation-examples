server.port=8081
spring.application.name=auth-service

# AWS Configuration
aws.region=us-east-1
aws.dynamodb.users-table=users-table
aws.sns.topic-arn=

# JWT Configuration
jwt.secret=defaultSecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmPleaseChangeInProduction
jwt.expiration=3600000
jwt.refresh.expiration=604800000

# Logging
logging.level.com.playstation.auth=INFO
logging.level.software.amazon.awssdk=WARN
